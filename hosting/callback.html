<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TikTok Authorization – WE, HUMANITY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f10;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1c1c1f;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h2 { margin: 0 0 12px; font-weight: 500; font-size: 22px; }
    p { color: #a1a1aa; line-height: 1.5; font-size: 14px; margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Connecting TikTok...</h2>
    <p>Returning you to WE, HUMANITY Studio at <code>http://127.0.0.1:5695</code> to complete the authorization.</p>
    <a id="fallback-link" class="btn" href="#">Continue to Studio</a>
  </div>

  <script>
    const search = window.location.search || '';
    const targetUrl = 'http://127.0.0.1:5695/api/tiktok/callback' + search;
    document.getElementById('fallback-link').href = targetUrl;
    // Auto-redirect immediately
    window.location.replace(targetUrl);
  </script>
</body>
</html>
